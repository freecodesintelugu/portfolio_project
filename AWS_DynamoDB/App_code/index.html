<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Students DynamoDB App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>🎓 Student Records (DynamoDB)</h1>
    <p class="subtitle">Table: <strong>StudentsDB</strong> &nbsp;|&nbsp; Region: <strong>ap-south-1</strong></p>

    <form id="studentForm">
      <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" required placeholder="e.g. Priya Sharma" />
      </div>
      <div class="form-row">
        <label for="age">Age</label>
        <input type="number" id="age" required min="1" placeholder="e.g. 21" />
      </div>
      <div class="form-row">
        <label for="course">Course</label>
        <input type="text" id="course" required placeholder="e.g. B.Tech CSE" />
      </div>
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="e.g. priya@example.com" />
      </div>
      <button type="submit">Add Student</button>
    </form>

    <p id="statusMsg"></p>

    <h2>All Students</h2>
    <table id="studentsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Course</th>
          <th>Email</th>
          <th>Added On</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="studentsBody">
        <!-- rows injected by JS -->
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
